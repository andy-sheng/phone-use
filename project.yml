# Xcode project for DeviceHub. Generate it with `xcodegen generate` (scripts/build-app.sh does).
# DeviceHub.xcodeproj is derived from this file; edit this, not the project.
name: DeviceHub
options:
  bundleIdPrefix: dev.devicehub
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    # The embedded Python runtime is Apple silicon only.
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  DeviceHubPackage:
    path: .

targets:
  DeviceHub:
    type: application
    platform: macOS
    sources:
      - path: Sources/DeviceHubApp
    dependencies:
      - package: DeviceHubPackage
        product: DeviceHubKit
      - target: devicehub-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: devicehub-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Support/DeviceHub-Info.plist
      properties:
        CFBundleName: DeviceHub
        CFBundleDisplayName: DeviceHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: DeviceHub mirrors USB-connected iPhone screens through the system screen capture device.
    entitlements:
      path: Support/DeviceHub.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_NAME: DeviceHub
        PRODUCT_BUNDLE_IDENTIFIER: dev.devicehub.app
        # The embed script writes the Python runtime into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Debug runs the daemon from the checkout's .venv-daemon (scripts/setup-dev.sh).
        Debug:
          DEVICEHUB_EMBED_DAEMON: NO
        Release:
          DEVICEHUB_EMBED_DAEMON: YES
    postCompileScripts:
      - name: Embed Daemon Runtime
        basedOnDependencyAnalysis: false
        script: |
          [[ "${DEVICEHUB_EMBED_DAEMON}" == "YES" ]] || exit 0
          exec /bin/zsh "${SRCROOT}/scripts/embed-daemon.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" "${EXPANDED_CODE_SIGN_IDENTITY:--}"

  devicehub-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/devicehub-mcp
    dependencies:
      - package: DeviceHubPackage
        product: DeviceHubKit
    settings:
      base:
        PRODUCT_NAME: devicehub-mcp

  # Named apart from the app: "devicehub" and "DeviceHub" share build directories and module
  # files on case-insensitive volumes.
  devicehub-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/devicehub
    dependencies:
      - package: DeviceHubPackage
        product: DeviceHubKit
    settings:
      base:
        PRODUCT_NAME: devicehub
        PRODUCT_MODULE_NAME: devicehub_cli

schemes:
  DeviceHub:
    build:
      targets:
        DeviceHub: all
    run:
      config: Debug
    archive:
      config: Release
