name: Release macOS

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (MAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phone-use-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate release metadata
        run: |
          VERSION="${RELEASE_VERSION#v}"
          python3 -c 'import runpy,sys; runpy.run_path("scripts/release.py")["valid_version"](sys.argv[1])' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Validate release credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = ["DEVELOPER_ID_P12", "DEVELOPER_ID_P12_PASSWORD", "APPLE_ID", "APPLE_TEAM_ID", "APPLE_APP_SPECIFIC_PASSWORD", "SPARKLE_PRIVATE_KEY"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing Actions secrets: " + ", ".join(missing))
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/runtime-cache
            .build/maa-assets
            .build/android
            .build/sparkle
          key: macos-arm64-assets-${{ hashFiles('Daemon/requirements.txt', 'Automation/requirements.txt', 'Automation/assets.json', 'scripts/android-assets.json', 'scripts/sparkle-assets.json') }}
      - name: Prepare dependencies
        run: |
          brew install xcodegen
          PYTHON=python3 scripts/setup-dev.sh
          MAA_PYTHON=python3 scripts/setup-automation.sh
          python3 scripts/prepare-sparkle.py
      - name: Test
        run: |
          swift test --cache-path .build/swift-cache --config-path .build/swift-config --security-path .build/swift-security
          PYTHONPATH=Daemon .venv-daemon/bin/python -m unittest discover -s Daemon/tests -v
          PYTHONPATH=Automation .venv-maa/bin/python -m unittest discover -s Automation/tests -v
          swiftc Sources/AutomationApp/AutomationSelection.swift Tests/AutomationSelectionTests.swift -o .build/test-selection
          .build/test-selection
          python3 -m unittest discover -s scripts/tests -v
      - name: Prepare temporary signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/ci-signing.py
      - name: Build, notarize and sign updates
        run: |
          python3 scripts/release.py --version "$VERSION" --build-number "$BUILD_NUMBER" \
            --repository "$RELEASE_REPOSITORY" --notary-profile "$NOTARY_PROFILE" \
            --sparkle-key "$SPARKLE_KEY_FILE"
      - name: Remove private signing material
        if: always()
        run: python3 scripts/ci-signing.py clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            dist/phone-use-*.dmg
            dist/phone-use-*.zip
            dist/phone-use-*.sha256
            dist/release-manifest.json
            dist/pages/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: release-diagnostics
          retention-days: 7
          path: |
            .build/xcode/build-*.log
            .build/releases/*/*.submission.json
            .build/releases/*/*.result.json
            .build/releases/*/*.notary-log.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate publishing credentials
        env:
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
          RELEASES_TOKEN_CONFIGURED: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          if [[ "$RELEASE_REPOSITORY" != "$GITHUB_REPOSITORY" && "$RELEASES_TOKEN_CONFIGURED" != true ]]; then
            echo "::error::Missing Actions secret RELEASES_TOKEN for the public release repository."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: dist
      - name: Publish release, then update Pages
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: python3 scripts/publish-release.py
